<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="905" viewBox="0 0 1360 905"><rect x="0" y="0" width="1360" height="905" fill="#fffdf8" stroke="none" /><text x="40" y="40" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#516974">SHAFT STUDY  /  02     •     SIMPLE DOUBLE BEARING V2</text><text x="38" y="92" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#243a43">Three print files for the eight-disc shaft</text><text x="40" y="126" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#243a43">Opposed M3 × 35 socket screws   •   Ø6.50 central passage   •   Four 6704 bearings at the existing axial stations</text><line x1="40" y1="151" x2="1320" y2="151" stroke="#ccd5d4" /><text x="245" y="187" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#243a43" text-anchor="middle">E   End journal  × 2</text><text x="245" y="211" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#516974" text-anchor="middle">One socket recess, one hex pocket</text><circle cx="245.0" cy="330.0" r="93.08999999999999" fill="#e4eef0" stroke="#243a43" /><circle cx="245.0" cy="330.0" r="86.56499999999998" fill="#c5dce5" stroke="#243a43" /><circle cx="310.25" cy="330.0" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><circle cx="179.75" cy="330.0" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><circle cx="245.0" cy="264.75" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><circle cx="245.0" cy="395.25" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><circle cx="285.1099250560257" cy="289.8900749439743" r="26.099999999999998" fill="#9fc8de" stroke="#386b91" /><circle cx="285.1099250560257" cy="289.8900749439743" r="14.79" fill="#fffdf8" stroke="#386b91" /><polygon points="197.09,399.20 226.19,391.41 233.98,362.31 212.69,341.02 183.59,348.81 175.80,377.91" fill="#eac887" stroke="#977442" /><circle cx="204.8900749439743" cy="370.1099250560257" r="14.79" fill="#fffdf8" stroke="#386b91" /><circle cx="245.0" cy="330.0" r="28.275" fill="#fffdf8" stroke="#243a43" /><text x="245" y="460" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">6.80 mm thick, including the inner shoulder.</text><text x="245" y="482" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">Turn the far copy over about the NW–SE line.</text><text x="680" y="187" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#243a43" text-anchor="middle">N   OOBB nut carrier  × 2</text><text x="680" y="211" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#516974" text-anchor="middle">Four mounting pockets on the 7.5 mm grid</text><circle cx="680.0" cy="330.0" r="102.225" fill="#efdaaa" stroke="#243a43" /><polygon points="771.33,314.94 745.25,299.88 719.17,314.94 719.17,345.06 745.25,360.12 771.33,345.06" fill="#eac887" stroke="#977442" /><circle cx="745.25" cy="330.0" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><polygon points="588.67,345.06 614.75,360.12 640.83,345.06 640.83,314.94 614.75,299.88 588.67,314.94" fill="#eac887" stroke="#977442" /><circle cx="614.75" cy="330.0" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><polygon points="664.94,238.67 649.88,264.75 664.94,290.83 695.06,290.83 710.12,264.75 695.06,238.67" fill="#eac887" stroke="#977442" /><circle cx="680.0" cy="264.75" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><polygon points="695.06,421.33 710.12,395.25 695.06,369.17 664.94,369.17 649.88,395.25 664.94,421.33" fill="#eac887" stroke="#977442" /><circle cx="680.0" cy="395.25" r="15.659999999999998" fill="#fffdf8" stroke="#9b4c70" /><circle cx="720.1099250560258" cy="289.8900749439743" r="14.79" fill="#fffdf8" stroke="#386b91" /><circle cx="639.8900749439742" cy="370.1099250560257" r="14.79" fill="#fffdf8" stroke="#386b91" /><circle cx="680.0" cy="330.0" r="28.275" fill="#fffdf8" stroke="#243a43" /><text x="680" y="460" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">4.90 mm thick. Nut pockets face their end journal.</text><text x="680" y="482" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">Populate four on the drive end; the far set is optional.</text><text x="1115" y="187" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#243a43" text-anchor="middle">C   Eccentric half  × 4</text><text x="1115" y="211" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#516974" text-anchor="middle">One shoulder and half a journal</text><circle cx="1124.2277434944845" cy="339.22774349448446" r="93.08999999999999" fill="#bdddc4" stroke="#243a43" /><circle cx="1124.2277434944845" cy="339.22774349448446" r="86.56499999999998" fill="#e4f0e5" stroke="#243a43" /><line x1="1036.7" y1="251.7" x2="1193.3" y2="408.3" stroke="#548169" stroke-dasharray="4 4" /><circle cx="1124.2277434944845" cy="339.22774349448446" r="2" fill="#376849" stroke="none" /><circle cx="1155.1099250560258" cy="289.8900749439743" r="14.79" fill="#fffdf8" stroke="#386b91" /><circle cx="1074.8900749439742" cy="370.1099250560257" r="14.79" fill="#fffdf8" stroke="#386b91" /><circle cx="1115.0" cy="330.0" r="28.275" fill="#fffdf8" stroke="#243a43" /><text x="1115" y="460" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">2.00 mm of Ø19.90 journal + 1.75 mm of shoulder.</text><text x="1115" y="482" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">Two halves make each 4.00 mm bearing seat.</text><line x1="40" y1="510" x2="1320" y2="510" stroke="#ccd5d4" /><text x="40" y="548" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="650" fill="#243a43">Axial order and screw direction</text><text x="40" y="575" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#243a43">Both socket heads are accessible from their own end. The hex pockets face out for nut loading.</text><rect x="100" y="609" width="197.2" height="92" fill="#c5dce5" stroke="#243a43" /><text x="198.6" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">E</text><text x="198.6" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">6.80</text><rect x="297.2" y="609" width="142.10000000000002" height="92" fill="#efdaaa" stroke="#243a43" /><text x="368.25" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">N</text><text x="368.25" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">4.90</text><rect x="439.29999999999995" y="609" width="108.75" height="92" fill="#bdddc4" stroke="#243a43" /><text x="493.67499999999995" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">C</text><text x="493.67499999999995" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#243a43" text-anchor="middle">A</text><rect x="548.05" y="609" width="108.75" height="92" fill="#bdddc4" stroke="#243a43" /><text x="602.425" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">C</text><text x="602.425" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#243a43" text-anchor="middle">A</text><rect x="656.8" y="609" width="108.75" height="92" fill="#bdddc4" stroke="#243a43" /><text x="711.175" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">C</text><text x="711.175" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#243a43" text-anchor="middle">B</text><rect x="765.55" y="609" width="108.75" height="92" fill="#bdddc4" stroke="#243a43" /><text x="819.925" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">C</text><text x="819.925" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#243a43" text-anchor="middle">B</text><rect x="874.3" y="609" width="142.10000000000002" height="92" fill="#efdaaa" stroke="#243a43" /><text x="945.3499999999999" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">N</text><text x="945.3499999999999" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">4.90</text><rect x="1016.4000000000001" y="609" width="197.2" height="92" fill="#c5dce5" stroke="#243a43" /><text x="1115.0" y="644" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#243a43" text-anchor="middle">E</text><text x="1115.0" y="672" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43" text-anchor="middle">6.80</text><rect x="166.7" y="598" width="115.99999999999999" height="7" fill="#738790" stroke="none" /><rect x="490.04999999999995" y="598" width="116.0" height="7" fill="#738790" stroke="none" /><rect x="707.55" y="598" width="116.0" height="7" fill="#738790" stroke="none" /><rect x="1030.9" y="598" width="116.0" height="7" fill="#738790" stroke="none" /><text x="50" y="693" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#243a43">Drive</text><text x="1225" y="693" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#243a43">Top</text><rect x="108.7" y="724" width="87" height="12" fill="#aac9db" stroke="#386b91" /><rect x="195.7" y="727.5" width="1015" height="5" fill="#aac9db" stroke="#386b91" /><rect x="1126.6" y="723" width="72.5" height="4" fill="#eac887" stroke="#977442" /><rect x="1126.6" y="733" width="72.5" height="4" fill="#eac887" stroke="#977442" /><text x="1223" y="735" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#386b91">→</text><rect x="1117.9" y="752" width="87" height="12" fill="#aac9db" stroke="#386b91" /><rect x="102.90000000000003" y="755.5" width="1015" height="5" fill="#aac9db" stroke="#386b91" /><rect x="114.5" y="751" width="72.5" height="4" fill="#eac887" stroke="#977442" /><rect x="114.5" y="761" width="72.5" height="4" fill="#eac887" stroke="#977442" /><text x="1223" y="763" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#386b91">←</text><text x="42" y="799" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="650" fill="#243a43">Hardware check</text><text x="185" y="799" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#243a43">38.40 mm overall. Each 35 mm screw engages the full 2.50 mm nut and ends 0.10 mm below the opposite face.</text><rect x="34" y="823" width="1292" height="63" fill="#ebf1ee" stroke="none" /><text x="50" y="850" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#243a43">Clocking</text><text x="149" y="850" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43">A and B are 180° apart. Their throw runs NW–SE, perpendicular to the NE–SW tie pair. Grey bars are bearing stations.</text><text x="50" y="875" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#243a43">Print check</text><text x="149" y="875" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#243a43">The narrowest end-pocket web is 0.27 mm. Confirm it with a single end-journal print before committing to the full stack.</text></svg>