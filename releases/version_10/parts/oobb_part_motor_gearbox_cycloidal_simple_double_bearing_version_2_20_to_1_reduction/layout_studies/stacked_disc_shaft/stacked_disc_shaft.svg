<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140"><rect x="0" y="0" width="1500" height="1140" fill="#fffefa" stroke="none" /><text x="44" y="38" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#506670">DESIGN STUDY     /     SIMPLE DOUBLE BEARING V2     /     INPUT SHAFT</text><text x="42" y="88" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="43" font-weight="700" fill="#203844">Stacked-disc shaft</text><text x="43" y="121" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#203844">Two M3 × 35 ties clamp the stack. Four independent M3 mounts face the drive end. The central M6 passage stays open.</text><line x1="44" y1="146" x2="1456" y2="146" stroke="#72848a" stroke-width="1" /><text x="248" y="184" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="650" fill="#203844" text-anchor="middle">01   Drive face</text><text x="248" y="208" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#506670" text-anchor="middle">Socket heads and mounting bores</text><circle cx="248.0" cy="336.0" r="122.85" fill="#d8dfe3" stroke="#203844" /><circle cx="248.0" cy="336.0" r="91.0" fill="#fffefa" stroke="#203844" /><circle cx="248.0" cy="336.0" r="90.54499999999999" fill="#deebe7" stroke="#203844" /><circle cx="316.25" cy="336.0" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><circle cx="248.0" cy="267.75" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><circle cx="179.75" cy="336.0" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><circle cx="248.0" cy="404.25" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><circle cx="290.46883327806404" cy="293.53116672193596" r="27.299999999999997" fill="#c6dfec" stroke="#3c7193" stroke-width="1.8" /><circle cx="290.46883327806404" cy="293.53116672193596" r="15.469999999999999" fill="none" stroke="#3c7193" stroke-dasharray="3 2" /><circle cx="205.53116672193596" cy="378.46883327806404" r="27.299999999999997" fill="#c6dfec" stroke="#3c7193" stroke-width="1.8" /><circle cx="205.53116672193596" cy="378.46883327806404" r="15.469999999999999" fill="none" stroke="#3c7193" stroke-dasharray="3 2" /><circle cx="248.0" cy="336.0" r="29.575" fill="#fffefa" stroke="#203844" stroke-width="1.6" /><line x1="243" y1="336" x2="253" y2="336" stroke="#72848a" stroke-width="1" /><line x1="248" y1="331" x2="248" y2="341" stroke="#72848a" stroke-width="1" /><text x="248" y="482" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Ø19.90 journal in the Ø20 × Ø27 × 4 bearing.</text><text x="248" y="506" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Rose: four Ø3.60 mounting bores on 7.50 pitch.</text><text x="248" y="530" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Blue: Ø6.00 head pockets; Ø3.40 tie bores below.</text><text x="739" y="184" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="650" fill="#203844" text-anchor="middle">02   Nut disc behind the 6704</text><text x="739" y="208" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#506670" text-anchor="middle">Split face, lid lifted</text><circle cx="739.0" cy="336.0" r="106.925" fill="#deebe7" stroke="#203844" /><circle cx="739.0" cy="336.0" r="91.0" fill="none" stroke="#74858d" stroke-dasharray="5 4" /><polygon points="834.533,320.248 807.250,304.496 779.967,320.248 779.967,351.752 807.250,367.504 834.533,351.752" fill="#e9c587" stroke="#946a32" /><circle cx="807.25" cy="336.0" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><polygon points="723.248,240.467 707.496,267.750 723.248,295.033 754.752,295.033 770.504,267.750 754.752,240.467" fill="#e9c587" stroke="#946a32" /><circle cx="739.0" cy="267.75" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><polygon points="643.467,351.752 670.750,367.504 698.033,351.752 698.033,320.248 670.750,304.496 643.467,320.248" fill="#e9c587" stroke="#946a32" /><circle cx="670.75" cy="336.0" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><polygon points="754.752,431.533 770.504,404.250 754.752,376.967 723.248,376.967 707.496,404.250 723.248,431.533" fill="#e9c587" stroke="#946a32" /><circle cx="739.0" cy="404.25" r="16.38" fill="#fffefa" stroke="#914b70" stroke-width="1.8" /><circle cx="781.468833278064" cy="293.53116672193596" r="15.469999999999999" fill="#c6dfec" stroke="#3c7193" stroke-dasharray="none" /><circle cx="696.531166721936" cy="378.46883327806404" r="15.469999999999999" fill="#c6dfec" stroke="#3c7193" stroke-dasharray="none" /><circle cx="739.0" cy="336.0" r="29.575" fill="#fffefa" stroke="#203844" stroke-width="1.6" /><line x1="734" y1="336" x2="744" y2="336" stroke="#72848a" stroke-width="1" /><line x1="739" y1="331" x2="739" y2="341" stroke="#72848a" stroke-width="1" /><text x="739" y="482" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Gold: standard M3 hex pockets, flats facing out.</text><text x="739" y="506" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Dashed: Ø20 bearing bore projected onto this layer.</text><text x="739" y="530" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Ø23.50 disc leaves 1.11 mm outside the pockets.</text><text x="1230" y="184" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="650" fill="#203844" text-anchor="middle">03   Eccentric journals</text><text x="1230" y="208" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#506670" text-anchor="middle">Disc A and disc B superimposed</text><circle cx="1216.35" cy="336.0" r="90.54499999999999" fill="#f5ddd5" stroke="#ac6857" stroke-width="2" /><circle cx="1243.65" cy="336.0" r="90.54499999999999" fill="#dfece0" stroke="#467862" fill-opacity="0.76" stroke-width="2" /><circle cx="1216.35" cy="336.0" r="90.54499999999999" fill="none" stroke="#ac6857" stroke-dasharray="5 4" /><circle cx="1272.468833278064" cy="293.53116672193596" r="15.469999999999999" fill="#c6dfec" stroke="#3c7193" stroke-dasharray="none" /><circle cx="1187.531166721936" cy="378.46883327806404" r="15.469999999999999" fill="#c6dfec" stroke="#3c7193" stroke-dasharray="none" /><circle cx="1230.0" cy="336.0" r="29.575" fill="#fffefa" stroke="#203844" stroke-width="1.6" /><line x1="1225" y1="336" x2="1235" y2="336" stroke="#72848a" stroke-width="1" /><line x1="1230" y1="331" x2="1230" y2="341" stroke="#72848a" stroke-width="1" /><text x="1230" y="482" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Ø19.90 journals orbit at +1.50 / −1.50 mm in X.</text><text x="1230" y="506" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">All three bores stay on the same axes in every disc.</text><text x="1230" y="530" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844" text-anchor="middle">Minimum journal wall at a tie bore: 0.52 mm.</text><line x1="493" y1="162" x2="493" y2="543" stroke="#d3dddc" stroke-width="1" /><line x1="985" y1="162" x2="985" y2="543" stroke="#d3dddc" stroke-width="1" /><rect x="34" y="561" width="1432" height="60" fill="#eff1e9" stroke="none" /><text x="52" y="586" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#203844">Bearing limit</text><text x="194" y="586" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#203844">The four nut pockets require Ø21.28. Even bare standard nuts need about Ø20.74; the bearing bore is Ø20.</text><text x="194" y="610" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844">The four mounting screws pass through the journal. Their nuts load into D02 on the gearbox side of that bearing.</text><text x="44" y="660" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="650" fill="#203844">04   Axial fastening paths</text><text x="44" y="685" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670">Separate lanes show holes at different angles. Z increases from the drive face toward the top.</text><rect x="77.0" y="724" width="75.6" height="201" fill="#dce7e6" stroke="#8a9c9f" /><rect x="152.6" y="724" width="60.20000000000002" height="201" fill="#f0dcba" stroke="#8a9c9f" /><rect x="212.8" y="724" width="88.90000000000003" height="201" fill="#c6ddcf" stroke="#8a9c9f" /><rect x="301.70000000000005" y="724" width="24.5" height="201" fill="#c6ddcf" stroke="#8a9c9f" /><rect x="326.20000000000005" y="724" width="80.49999999999994" height="201" fill="#eed2c7" stroke="#8a9c9f" /><rect x="406.7" y="724" width="21.700000000000045" height="201" fill="#eed2c7" stroke="#8a9c9f" /><rect x="428.40000000000003" y="724" width="78.39999999999998" height="201" fill="#dce7e6" stroke="#8a9c9f" /><rect x="506.8" y="724" width="61.59999999999985" height="201" fill="#eaf0eb" stroke="#8a9c9f" /><rect x="568.3999999999999" y="724" width="51.80000000000007" height="201" fill="#dce7e6" stroke="#8a9c9f" /><rect x="89.6" y="714" width="56.0" height="8" fill="#78909a" stroke="none" /><rect x="245.70000000000002" y="714" width="56.00000000000003" height="8" fill="#78909a" stroke="none" /><rect x="350.7" y="714" width="56.0" height="8" fill="#78909a" stroke="none" /><rect x="506.8" y="714" width="55.99999999999994" height="8" fill="#78909a" stroke="none" /><text x="77.0" y="707" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="13" font-weight="650" fill="#506670">DRIVE</text><text x="620.1999999999999" y="707" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="13" font-weight="650" fill="#506670" text-anchor="end">TOP</text><rect x="77.0" y="751.5" width="543.1999999999999" height="19" fill="#fffefa" stroke="#203844" /><text x="645" y="766" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#203844">M6 • Ø6.50 open end to end</text><rect x="77.0" y="813.0" width="93.80000000000001" height="14" fill="#fffefa" stroke="#914b70" /><rect x="170.8" y="805.0" width="42.0" height="30" fill="#e9c587" stroke="#956930" /><rect x="170.8" y="812.5" width="35.0" height="15" fill="#fffefa" stroke="#914b70" /><line x1="61.0" y1="820" x2="205.8" y2="820" stroke="#914b70" stroke-width="1.5" stroke-dasharray="4 3" /><text x="645" y="815" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#203844">4 × M3 mount from drive face</text><text x="645" y="836" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670">Tips stop before the D03 lid.</text><rect x="77.0" y="871.0" width="47.60000000000001" height="32" fill="#fffefa" stroke="#3c7193" /><rect x="82.6" y="873.0" width="42.000000000000014" height="28" fill="#c6dfec" stroke="#3c7193" /><rect x="124.60000000000001" y="881.5" width="490.0" height="11" fill="#c6dfec" stroke="#3c7193" /><rect x="578.1999999999999" y="867.0" width="35.0" height="12" fill="#e9c587" stroke="#956930" /><rect x="578.1999999999999" y="895.0" width="35.0" height="12" fill="#e9c587" stroke="#956930" /><text x="645" y="879" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#203844">2 × M3 × 35 socket caps</text><text x="645" y="901" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670">Top nuts engage 2.5 mm.</text><line x1="124.60000000000001" y1="945" x2="614.6" y2="945" stroke="#3c7193" stroke-width="1" /><line x1="124.60000000000001" y1="940" x2="124.60000000000001" y2="950" stroke="#3c7193" stroke-width="1" /><line x1="614.6" y1="940" x2="614.6" y2="950" stroke="#3c7193" stroke-width="1" /><text x="369.6" y="969" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="650" fill="#3c7193" text-anchor="middle">35.00 mm under head to tip</text><text x="44" y="1004" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Proposed stack depth 38.80 mm  •  Grey bars mark the four existing 6704 stations.</text><text x="44" y="1030" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Ties at (+4.67,+4.67) and (−4.67,−4.67) mm; four mounting axes at (±7.50,0) and (0,±7.50).</text><line x1="918" y1="642" x2="918" y2="1045" stroke="#c2cfcc" stroke-width="1" /><text x="944" y="660" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="650" fill="#203844">Nine printed discs, in stack order</text><text x="946" y="692" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D01</text><text x="998" y="692" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Lower head disc + bearing shoulder</text><text x="1445" y="692" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">5.40 mm</text><text x="946" y="716" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D02</text><text x="998" y="716" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Four-nut mounting disc</text><text x="1445" y="716" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">4.30 mm</text><text x="946" y="740" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D03</text><text x="998" y="740" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Nut lid + A shoulder and journal (+X)</text><text x="1445" y="740" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">6.35 mm</text><text x="946" y="764" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D04</text><text x="998" y="764" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Disc A middle shoulder (+X)</text><text x="1445" y="764" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">1.75 mm</text><text x="946" y="788" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D05</text><text x="998" y="788" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Disc B middle shoulder and journal (−X)</text><text x="1445" y="788" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">5.75 mm</text><text x="946" y="812" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D06</text><text x="998" y="812" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Disc B upper shoulder (−X)</text><text x="1445" y="812" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">1.55 mm</text><text x="946" y="836" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D07</text><text x="998" y="836" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Upper distance disc</text><text x="1445" y="836" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">5.60 mm</text><text x="946" y="860" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D08</text><text x="998" y="860" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Upper journal + bearing shoulder</text><text x="1445" y="860" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">4.40 mm</text><text x="946" y="884" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#203844">D09</text><text x="998" y="884" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Top end disc / two joining nuts</text><text x="1445" y="884" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#506670" text-anchor="end">3.70 mm</text><text x="946" y="944" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="650" fill="#203844">Clocking and print orientation</text><text x="946" y="970" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Mark the +X side. Clock A and B 180° apart.</text><text x="946" y="994" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">D03 has a Ø24.60 lid under its offset journal.</text><text x="946" y="1018" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#203844">Print stepped discs with the widest shoulder on the bed.</text><rect x="34" y="1060" width="1432" height="60" fill="#e8eff1" stroke="none" /><text x="50" y="1085" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#203844">Print split</text><text x="165" y="1085" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844">D01 prints head recess up. D02 and D09 print hex pockets up. Drop the four mounting nuts into D02 and close the pockets with D03.</text><text x="50" y="1110" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#203844">Fit to resolve</text><text x="165" y="1110" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#203844">D01 leaves only 0.35 mm beside each head pocket, both to the M6 passage and to the OD. This is a layout study; that wall needs a print test.</text></svg>